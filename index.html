<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Гардероб Аси</title>
<meta name="theme-color" content="#5a1622">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Гардероб">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%235a1622'/><path d='M3 5l3-2h4l3 2-2 2v6H5V7z' fill='%23f3ece6'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>
<div class="frame">
  <div class="screen">
    <header class="bar">
      <span class="bar-title" id="title">гардероб</span>
      <button class="bar-season" data-act="season" id="seasonBtn" title="фильтр по сезону">весь год</button>
      <nav class="bar-menu">
        <button data-act="add" id="addBtn" hidden>+ вещь</button>
        <button data-act="theme">клетка</button>
        <button data-act="sound" id="soundBtn">звук</button>
        <button data-act="full">экран</button>
        <button data-act="auth" id="authBtn" hidden>вход</button>
      </nav>
    </header>

    <div class="weather" id="weather" hidden>
      <span class="weather-text" id="weatherText"></span>
      <button class="weather-btn" data-act="city" title="сменить город">📍</button>
      <button class="weather-btn" data-act="hideweather" aria-label="скрыть">×</button>
    </div>

    <main class="board" id="board">
      <section class="col col-side">
        <div class="slot" data-cat="outer"></div>
        <div class="slot" data-cat="hat"></div>
        <div class="slot" data-cat="shoes"></div>
      </section>
      <section class="col col-mid">
        <div class="slot slot-wide" data-cat="top"></div>
        <div class="slot slot-wide" data-cat="bottom"></div>
      </section>
      <section class="col col-side">
        <div class="slot" data-cat="jewelry"></div>
        <div class="slot" data-cat="bag"></div>
      </section>
      <div class="actions">
        <button class="big" data-act="like">♥ в лукбук</button>
        <button class="big big-sun" data-act="today">☀ что надеть сегодня</button>
        <button class="big big-blue" data-act="random">рандом</button>
        <button class="big" data-act="wear">надень меня</button>
      </div>
    </main>

    <section class="lookbook" id="lookbook" hidden>
      <div class="lookbook-grid" id="lookbookGrid"></div>
    </section>

    <footer class="tabs">
      <button class="tab on" data-tab="board">гардероб</button>
      <button class="tab" data-tab="lookbook" id="lookTab">лукбук</button>
    </footer>
  </div>
  <div class="hint">
    <span>примерочная-95 · v6</span>
    <span class="keys">↑↓ вещь · ←→ листать · пробел — рандом · enter — надеть · L — лайк · S — сезон</span>
  </div>
</div>

<div class="modal" id="tryon" hidden>
  <div class="win">
    <div class="win-bar"><span>примерочная.exe</span><button data-act="close" aria-label="закрыть">×</button></div>
    <div class="win-body">
      <div class="stage" id="stage"></div>
      <div class="tune" id="tune" hidden>
        <p class="tune-label" id="tuneLabel">тапни вещь, потом двигай пальцем</p>
        <div class="tune-pad">
          <button data-nudge="0,-2">↑</button>
          <button data-nudge="-2,0">←</button>
          <button data-nudge="2,0">→</button>
          <button data-nudge="0,2">↓</button>
          <button data-scale="0.95">−</button>
          <button data-scale="1.05">+</button>
          <button data-act="resetfit" title="вернуть как было">↺</button>
        </div>
        <div class="tune-model" id="tuneModel" hidden>
          <label class="mini-btn">моё фото<input type="file" accept="image/*" id="modelFile" hidden></label>
          <button class="mini-btn" data-act="doll" id="dollBtn">вернуть манекен</button>
        </div>
      </div>
      <div class="win-actions">
        <button class="big" data-act="tune" id="tuneBtn">подогнать</button>
        <button class="big" data-act="like">♥ в лукбук</button>
        <button class="big big-blue" data-act="random">рандом</button>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="addModal" hidden>
  <div class="win">
    <div class="win-bar"><span id="addTitle">новая_вещь.exe</span><button data-act="close" aria-label="закрыть">×</button></div>
    <div class="win-body">
      <label class="drop" id="drop">
        <input type="file" accept="image/*" id="addFile" hidden>
        <img id="addPreview" alt="" hidden>
        <span id="dropText">📷 сфоткать<br>или выбрать фото</span>
      </label>
      <label class="check" id="addBgRow"><input type="checkbox" id="addBg" checked> убрать фон автоматически</label>
      <p class="status" id="addStatus"></p>
      <p class="field-label">категория</p>
      <div class="cats" id="addCats"></div>
      <p class="field-label">сезон <small>(ничего не выбрано = всесезонная)</small></p>
      <div class="cats cats-4" id="addSeasons"></div>
      <input class="field" id="addName" placeholder="название, например «серый свитер»" maxlength="60" autocomplete="off">
      <button class="big big-blue" data-act="save" id="saveBtn">в гардероб</button>
    </div>
  </div>
</div>

<div class="modal" id="authModal" hidden>
  <div class="win win-small">
    <div class="win-bar"><span>вход.exe</span><button data-act="close" aria-label="закрыть">×</button></div>
    <form class="win-body" id="authForm">
      <input class="field" type="email" id="authEmail" placeholder="почта" autocomplete="username" required>
      <input class="field" type="password" id="authPass" placeholder="пароль" autocomplete="current-password" required>
      <p class="status" id="authStatus"></p>
      <button class="big big-blue" type="submit" id="authSubmit">войти</button>
    </form>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="vendor/supabase.js?v=6"></script>
<script src="config.js?v=6"></script>
<script src="wardrobe.js?v=6"></script>
<script src="app.js?v=6"></script>
</body>
</html>
